name: CI

# Everything that must be true before a PR lands:
#   typecheck → dashboard build → guide build → render self-test
# on Linux, macOS and Windows, because the project claims all three.
#
# The full end-to-end smoke test (which drives Chromium and renders a video)
# runs on Ubuntu only: it is the slowest job by far, and three OSes × two Node
# versions × several minutes is a tax for very little extra signal. macOS and
# Windows exist here to catch the things that actually differ — path handling,
# ffmpeg-static resolution, and the Windows process-tree kill in scripts/.
#
# CI never uses a model key or a cloud voice: REELFORGE_LLM_PROVIDER=none and
# REELFORGE_TTS_PROVIDER=none mean it passes on the offline planner, not on a
# contributor's personal credentials.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Playwright's postinstall downloads three browsers; the smoke job installs
  # the one it needs explicitly instead.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  REELFORGE_TTS_PROVIDER: none
  REELFORGE_LLM_PROVIDER: none
  REELFORGE_ENFORCE_CREDITS: "false"
  REELFORGE_LOG_LEVEL: warn
  CI: "true"

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
            smoke: true
          - os: ubuntu-latest
            node: 24
            smoke: true
          - os: macos-latest
            node: 22
            smoke: false
          - os: windows-latest
            node: 22
            smoke: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The root tsconfig covers core/agent/render/api/cli/providers/scripts;
      # web and agent each have their own (react-jsx / DOM libs).
      - name: Typecheck
        run: |
          npm run typecheck
          node node_modules/typescript/bin/tsc -p packages/web/tsconfig.json --noEmit
          node node_modules/typescript/bin/tsc -p packages/agent/tsconfig.json --noEmit

      - name: Build dashboard
        run: npx vite build --config packages/web/vite.config.ts

      - name: Build guide widget
        run: node packages/guide/build.mjs

      # Pure ffmpeg path: synthetic webm + fabricated steps → MP4 + captions +
      # poster. No browser, no display, no key. This is the job that proves the
      # render pipeline works on the runner's OS.
      - name: Render self-test
        run: node packages/render/test/render-selftest.ts

      - name: Provider self-test
        run: node packages/providers/test/providers-selftest.ts

      - name: Install Chromium
        if: matrix.smoke
        run: npx playwright install --with-deps chromium

      - name: Seed workspace and API key
        if: matrix.smoke
        run: npm run seed

      - name: MCP stdio bridge
        if: matrix.smoke
        run: npm run test:mcp

      - name: Smoke test (records, renders, publishes a demo)
        if: matrix.smoke
        run: npm run smoke

      - name: Upload smoke artifacts
        if: always() && matrix.smoke
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            data/videos/**/*.mp4
            data/videos/**/*.srt
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: docker build
    # PRs get fast feedback from `test`; the image itself is built on main so a
    # broken Dockerfile cannot sit unnoticed until a release tag.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: reelforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke the image
        run: |
          docker run -d --name reelforge-ci -p 4420:4400 \
            -e REELFORGE_TTS_PROVIDER=none reelforge:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4420/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          curl -fsS -o /dev/null http://127.0.0.1:4420/app/
          node -e "const h=require('/tmp/health.json'); if(!h.data?.features?.includes('guides')) process.exit(1)"
          docker logs reelforge-ci
          docker rm -f reelforge-ci
