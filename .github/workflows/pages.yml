name: Deploy site

# Publishes the marketing site in site/ to GitHub Pages.
#
# One-time setup (the repo owner does this once):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# The site is deliberately build-less (plain HTML/CSS/JS), so this workflow only
# uploads the folder — there is nothing to compile and nothing to go stale.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the site exists
        run: |
          test -f site/index.html || { echo "site/index.html is missing"; exit 1; }
          du -sh site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
