name: Release

# Cut a release by pushing a tag:  git tag v0.2.0 && git push origin v0.2.0
#
# Publishes the multi-arch-capable image to GitHub Container Registry:
#   ghcr.io/OWNER/reelforge:0.2.0
#   ghcr.io/OWNER/reelforge:0.2
#   ghcr.io/OWNER/reelforge:latest
#
# The image is public by default for public repositories (a package inherits
# visibility from the repo). For a private repo, uncomment the visibility step
# at the bottom and make the package public once.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # GHCR requires a lowercase image path; repositories are case-sensitive.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: build + push image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Reelforge
            org.opencontainers.image.description=Self-hosted, open reimplementation of Screenforge Director — records a product demo in a real browser and publishes a narrated video, help article and in-app guide from one Product Graph.
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Playwright's base image ships browsers for both platforms, so the
          # arm64 build works for Apple Silicon / ARM servers. Drop arm64 here
          # if you would rather halve the release time.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Pull: \`docker pull ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

# GHCR packages are private for private repositories. To make the image
# pullable by anyone, either publish the repo publicly (the package inherits
# its visibility) or flip the package's visibility once in
# https://github.com/users/OWNER/packages/container/reelforge/settings