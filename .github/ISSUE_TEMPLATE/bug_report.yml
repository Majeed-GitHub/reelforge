name: Bug report
description: Something does not work the way the docs say it does.
title: "[bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Reelforge is a pipeline (plan → drive → capture →
        render → index → publish), so the more precisely you can say *which
        stage* failed, the faster this gets fixed.

        ⚠️ **Security problems**: do not report them here. See [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error, API response or dashboard message.
      placeholder: |
        Expected: ...
        Actual: ... (paste the error envelope or console output)
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Exact commands / curl request / instruction given to the recorder.
      placeholder: |
        npm run seed && npm run dev
        POST /api/demos with instruction: "..."
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Which stage?
      multiple: true
      options:
        - Plan (the instruction → actions)
        - Drive (the browser / Playwright)
        - Capture (steps, screenshots, timings)
        - Render (ffmpeg, narration, captions, zoom)
        - Index (Product Graph / flows / staleness)
        - Publish (article, training doc, in-app guide)
        - Dashboard (/app)
        - MCP / API contract
        - CLI
        - Docker / deployment
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The `version` field from `GET /api/health`, or the commit SHA.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, Docker or bare metal, LLM/TTS provider, and whether a key was configured.
      placeholder: |
        Windows 11 · Node 25.8.1 · bare metal
        REELFORGE_TTS_PROVIDER=sapi, REELFORGE_LLM_PROVIDER=none
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / artifacts
      description: |
        Server log tail, `docker compose logs reelforge`, the failing step index,
        or the generated artifact. Redact API keys and personal data.
      render: shell
    validations:
      required: false
